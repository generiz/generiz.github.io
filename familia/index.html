<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#242e46"><title>Familia · Casa en equipo</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#263249;background:#f6f4f0}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #6c92ed;outline-offset:2px}.wrap{max-width:1120px;margin:auto;padding:24px 18px 70px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:25px}.brand{font-size:24px;font-weight:850;letter-spacing:-1px}.brand small{display:block;font-size:12px;font-weight:550;letter-spacing:0;color:#778095}.pill{border:1px solid #e6e5e1;border-radius:999px;padding:9px 15px;background:white;color:#48556b}.hero{background:#242e46;color:white;padding:28px;border-radius:24px;margin:0 0 22px;display:flex;align-items:center;justify-content:space-between;gap:20px}.hero h1{font-size:clamp(24px,4vw,35px);margin:0 0 8px;letter-spacing:-1px}.hero p{margin:0;color:#d5deec}.week{font-size:13px;background:#ffffff18;padding:12px 16px;border-radius:14px;white-space:nowrap}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}nav button,.btn{border:0;border-radius:13px;padding:11px 15px;background:white;color:#42506a;font-weight:700}.btn.primary,nav button.active{background:#5777de;color:white}.btn.ghost{border:1px solid #dfe2e7}.layout{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#fff;border:1px solid #eae8e5;border-radius:20px;padding:20px;box-shadow:0 5px 20px #29314b08}.wide{grid-column:1/-1}.card h2{font-size:18px;margin:0 0 15px;letter-spacing:-.4px}.muted{color:#7b8392;font-size:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stack{display:grid;gap:12px}.item{border:1px solid #edeff2;border-radius:14px;padding:13px}.name{font-weight:720}.tiny{font-size:12px;color:#788294}.avatar{display:inline-grid;place-items:center;border-radius:50%;width:31px;height:31px;font-size:13px;font-weight:800;color:white;flex-shrink:0}.tag{font-size:11px;background:#eef1fc;color:#485f9f;padding:5px 8px;border-radius:99px}.done{opacity:.56;text-decoration:line-through}.daygrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}.day{border:1px solid #e8e9ec;border-radius:13px;padding:11px;min-height:130px}.day strong{font-size:12px}.day p{font-size:13px;margin:10px 0 4px}.day small{font-size:11px;color:#7e8594}.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tools label{font-size:13px}.tools select,.tools input,input,select,textarea{border:1px solid #e1e4ea;border-radius:10px;padding:9px;background:#fff;color:#28334d}input[type=checkbox]{width:18px;height:18px;accent-color:#5777de}textarea{width:100%;min-height:80px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{display:grid;gap:5px;font-size:13px;font-weight:650}.field.full{grid-column:1/-1}.notice{background:#fff8e9;border:1px solid #f0ddaa;padding:13px;border-radius:12px;font-size:13px}.hidden{display:none!important}.shopping{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.shopping label{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid #eceef1;border-radius:12px;font-size:13px}.section{margin:0 0 22px}.section h3{font-size:14px;margin:0 0 10px}.checkboxes{display:flex;flex-wrap:wrap;gap:9px}.checkboxes label{border:1px solid #e4e7ec;border-radius:9px;padding:8px;font-size:12px}.footer{font-size:12px;color:#8c91a0;margin-top:20px}@media(max-width:720px){.layout{grid-template-columns:1fr}.hero{display:block}.week{display:inline-block;margin-top:15px}.daygrid{grid-template-columns:repeat(2,minmax(0,1fr))}.shopping{grid-template-columns:1fr 1fr}}@media(max-width:400px){.daygrid,.shopping,.formgrid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><header class="head"><div class="brand">🏡 Familia <small>Una casa, un equipo</small></div><button class="pill" id="reset">Restablecer ejemplo</button></header><section class="hero"><div><h1>Organizarnos sin sobrecargar a nadie.</h1><p>Tareas adecuadas para cada persona, comidas variadas y compras sin improvisar.</p></div><div class="week" id="weekLabel"></div></section><nav id="tabs"><button data-tab="inicio" class="active">Hoy</button><button data-tab="tareas">Responsabilidades</button><button data-tab="menu">Menú semanal</button><button data-tab="compras">Supermercado</button><button data-tab="recetas">Recetas</button></nav><div id="view"></div><div class="footer">Primera versión · Datos guardados en este navegador. La sincronización familiar entre celulares requerirá conectar un servidor.</div></main>
<script>
'use strict';
const MEMBERS=[{id:'nico',name:'Nico',color:'#557ad9',adult:true},{id:'euge',name:'Euge',color:'#d36a90',adult:true},{id:'marti',name:'Marti',color:'#58a99a',adult:false},{id:'pia',name:'Pía',color:'#d69b46',adult:false}];
const DAYS=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const BASE_TASKS=[
{id:'cocinar',name:'Preparar la comida',freq:'daily',eligible:['nico','euge'],weight:3},
{id:'mesa',name:'Poner y retirar la mesa',freq:'daily',eligible:['marti','pia','nico','euge'],weight:1},
{id:'ordenar',name:'Ordenar espacios comunes',freq:'daily',eligible:['marti','nico','euge'],weight:1},
{id:'habitacion',name:'Ordenar su habitación',freq:'daily',eligible:['marti','pia'],weight:1,mode:'shared'},
{id:'perro',name:'Limpiar los desechos del perro',freq:'daily',eligible:['nico','euge'],weight:2},
{id:'ropa',name:'Lavar la ropa',freq:'weekly',eligible:['nico','euge'],weight:2},
{id:'guardar',name:'Doblar y guardar ropa limpia',freq:'weekly',eligible:['marti','nico','euge'],weight:1},
{id:'pisos',name:'Barrer o aspirar',freq:'weekly',eligible:['marti','nico','euge'],weight:2},
{id:'banio',name:'Limpiar el baño',freq:'weekly',eligible:['nico','euge'],weight:3},
{id:'compras',name:'Hacer las compras',freq:'weekly',eligible:['nico','euge'],weight:2},
{id:'juguetes',name:'Guardar juguetes y objetos propios',freq:'daily',eligible:['pia'],weight:1,mode:'fixed'}];
const RECIPES=[
{id:'pollo',name:'Pollo al horno con verduras',kind:'almuerzo',category:'proteína',ingredients:[['Pollo',1,'kg'],['Papa',1,'kg'],['Zanahoria',4,'un'],['Cebolla',2,'un']],steps:'Cortar las verduras, condimentar y hornear junto con el pollo hasta cocinar completamente.'},
{id:'arroz',name:'Arroz con verduras y huevo',kind:'cena',category:'vegetariano',ingredients:[['Arroz',500,'g'],['Zanahoria',3,'un'],['Arvejas',1,'lata'],['Huevo',4,'un']],steps:'Cocinar arroz, saltear verduras y agregar huevo bien cocido.'},
{id:'pasta',name:'Pasta con salsa de tomate y carne',kind:'almuerzo',category:'proteína',ingredients:[['Pasta',500,'g'],['Carne molida',500,'g'],['Tomate',6,'un'],['Cebolla',1,'un']],steps:'Preparar salsa con carne bien cocida y tomate; mezclar con pasta.'},
{id:'tortilla',name:'Tortilla de verduras y ensalada',kind:'cena',category:'vegetariano',ingredients:[['Huevo',6,'un'],['Zapallito',2,'un'],['Lechuga',1,'un'],['Tomate',3,'un']],steps:'Cocinar la tortilla completamente y acompañar con ensalada lavada.'},
{id:'guiso',name:'Guiso de lentejas',kind:'almuerzo',category:'legumbres',ingredients:[['Lentejas',500,'g'],['Zanahoria',3,'un'],['Cebolla',2,'un'],['Tomate',4,'un']],steps:'Cocinar lentejas según indicación del envase y sumar verduras.'},
{id:'pescado',name:'Pescado con puré y ensalada',kind:'almuerzo',category:'proteína',ingredients:[['Pescado',800,'g'],['Papa',1,'kg'],['Lechuga',1,'un']],steps:'Cocinar el pescado completamente; acompañar con puré y ensalada.'},
{id:'sopa',name:'Sopa de verduras y sándwich',kind:'cena',category:'vegetariano',ingredients:[['Zapallo',700,'g'],['Zanahoria',3,'un'],['Pan integral',1,'paquete'],['Queso',200,'g']],steps:'Hervir verduras y procesar; acompañar con sándwich.'},
{id:'salteado',name:'Salteado de carne con arroz',kind:'cena',category:'proteína',ingredients:[['Carne',600,'g'],['Arroz',400,'g'],['Morrón',2,'un'],['Cebolla',2,'un']],steps:'Saltear la carne hasta cocción completa y acompañar con arroz.'},
{id:'ensalada',name:'Ensalada completa con garbanzos',kind:'cena',category:'legumbres',ingredients:[['Garbanzos',2,'latas'],['Tomate',4,'un'],['Lechuga',1,'un'],['Huevo',4,'un']],steps:'Lavar verduras, escurrir garbanzos y agregar huevo duro.'},
{id:'milanesas',name:'Milanesas al horno y ensalada',kind:'almuerzo',category:'proteína',ingredients:[['Pollo',800,'g'],['Pan rallado',300,'g'],['Huevo',2,'un'],['Lechuga',1,'un'],['Tomate',3,'un']],steps:'Rebozar el pollo y hornear hasta cocción completa.'},
{id:'verduras',name:'Verduras asadas con arroz',kind:'almuerzo',category:'vegetariano',ingredients:[['Zapallo',700,'g'],['Zanahoria',4,'un'],['Arroz',400,'g'],['Cebolla',2,'un']],steps:'Asar verduras condimentadas y servir con arroz.'}
];
const KEY='familia-v1'; const clone=x=>JSON.parse(JSON.stringify(x)); const initial=()=>({tasks:clone(BASE_TASKS),recipes:clone(RECIPES),weekOffset:0,assignments:{},done:{},menus:{},checked:{},extras:[],tab:'inicio'});
let state;try{state=Object.assign(initial(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{state=initial()}
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const monday=(offset=state.weekOffset)=>{let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7)+offset*7);return d};
const weekKey=()=>{let d=monday();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dayKey=n=>weekKey()+':'+n;
const member=id=>MEMBERS.find(m=>m.id===id);
const avatar=id=>{let m=member(id);return m?'<span class="avatar" style="background:'+m.color+'">'+esc(m.name[0])+'</span>':''};
const titlePerson=id=>member(id)?.name||'Sin asignar';
function assigned(task,day){const key=dayKey(day)+':'+task.id;if(state.assignments[key])return state.assignments[key];const choices=task.eligible.filter(id=>!!member(id));if(!choices.length)return [];if(task.mode==='shared')return choices;if(task.mode==='fixed')return [choices[0]];const schedule=state.tasks.filter(t=>t.freq===task.freq).sort((a,b)=>a.id.localeCompare(b.id));const ordinal=schedule.findIndex(t=>t.id===task.id);return [choices[(Math.floor((monday().getTime()-new Date(2026,9,19,12).getTime())/(7*864e5))+Math.max(0,ordinal)+(task.freq==='daily'?day:0)+7000)%choices.length]]}
function entries(day){return state.tasks.filter(t=>t.freq==='daily'||day===5).map(t=>({task:t,day,people:assigned(t,day)}))}
function weekMenu(){let key=weekKey();if(!state.menus[key]){state.menus[key]={};const pool=state.recipes;let serial=Math.floor(monday().getTime()/604800000);for(let d=0;d<7;d++){for(const kind of ['almuerzo','cena']){let choices=pool.filter(r=>r.kind===kind);state.menus[key][d+':'+kind]=choices[(serial+d*(kind==='almuerzo'?3:2)+(kind==='cena'?1:0))%choices.length]?.id||''}}save()}return state.menus[key]}
function recipeAt(d,k){return state.recipes.find(r=>r.id===weekMenu()[d+':'+k])}
function render(){document.getElementById('weekLabel').innerHTML='<div class="row"><button class="btn" onclick="moveWeek(-1)">←</button><strong>Semana del '+monday().toLocaleDateString('es-PY',{day:'numeric',month:'short'})+'</strong><button class="btn" onclick="moveWeek(1)">→</button></div>';document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));const fn={inicio:renderHome,tareas:renderTasks,menu:renderMenu,compras:renderShopping,recetas:renderRecipes}[state.tab]||renderHome;document.getElementById('view').innerHTML=fn();}
function moveWeek(n){state.weekOffset+=n;save();render()}
function setTab(tab){state.tab=tab;save();render()}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button[data-tab]');if(b)setTab(b.dataset.tab)};
document.getElementById('reset').onclick=()=>{if(confirm('¿Borrar cambios locales y restablecer los ejemplos?')){state=initial();save();render()}};
function renderHome(){const today=(new Date().getDay()+6)%7;let d=state.weekOffset===0?today:0;const list=entries(d);let complete=list.filter(e=>state.done[dayKey(d)+':'+e.task.id]).length;return '<div class="layout"><section class="card"><h2>Progreso del día</h2><h1 style="font-size:44px;margin:0">'+complete+' / '+list.length+'</h1><p class="muted">Tareas completadas · '+DAYS[d]+'</p><div class="stack">'+list.map(e=>taskItem(e)).join('')+'</div></section><section class="card"><h2>¿Qué comemos?</h2>'+['almuerzo','cena'].map(k=>{const r=recipeAt(d,k);return '<div class="item"><span class="tag">'+(k==='almuerzo'?'Almuerzo':'Cena')+'</span><p class="name">'+esc(r?.name||'Sin planificar')+'</p><span class="muted">'+esc(r?.category||'')+'</span></div>'}).join('')+'<p><button class="btn primary" onclick="setTab(\'menu\')">Ver menú de la semana →</button></p><div class="notice">Marti y Pía no reciben tareas de cocinar. Cada actividad tiene una lista de personas habilitadas.</div></section></div>'}
function taskItem(e){const key=dayKey(e.day)+':'+e.task.id;return '<div class="item row"><div><div class="'+(state.done[key]?'done':'name')+'">'+esc(e.task.name)+'</div><div class="row" style="justify-content:flex-start;margin-top:5px">'+e.people.map(id=>avatar(id)+'<span class="tiny">'+esc(titlePerson(id))+'</span>').join(' ')+'</div></div><input type="checkbox" aria-label="Completar '+esc(e.task.name)+'" '+(state.done[key]?'checked':'')+' onchange="toggleTask(\''+esc(key)+'\',this.checked)"></div>'}
function toggleTask(key,v){state.done[key]=v;save();render()}
function renderTasks(){return '<div class="layout"><section class="card wide"><div class="row"><h2>Reparto de responsabilidades</h2><span class="tag">La elegibilidad se respeta siempre</span></div><p class="muted">Seleccioná quién puede realizar cada tarea. El reparto se alterna entre esas personas. Las tareas fijas y compartidas también se pueden configurar.</p><div class="stack">'+state.tasks.map(t=>'<div class="item"><div class="row"><strong>'+esc(t.name)+'</strong><span class="tag">'+(t.freq==='daily'?'Diaria':'Semanal')+'</span></div><div class="checkboxes" style="margin-top:12px">'+MEMBERS.map(m=>'<label><input type="checkbox" '+(t.eligible.includes(m.id)?'checked':'')+' onchange="eligible(\''+esc(t.id)+'\',\''+m.id+'\',this.checked)"> '+esc(m.name)+'</label>').join('')+'</div><div class="tools" style="margin-top:10px"><label>Modo <select onchange="setTaskMode(\''+esc(t.id)+'\',this.value)">'+[['rotate','Rotativa'],['fixed','Fija'],['shared','Compartida']].map(([value,label])=>'<option value="'+value+'" '+((t.mode||'rotate')===value?'selected':'')+'>'+label+'</option>').join('')+'</select></label></div></div>').join('')+'</div></section><section class="card wide"><h2>Calendario de tareas</h2><div class="daygrid">'+DAYS.map((day,d)=>'<div class="day"><strong>'+day+'</strong>'+entries(d).map(e=>'<p>'+esc(e.task.name)+'<small style="display:block">'+e.people.map(titlePerson).join(', ')+'</small></p>').join('')+'</div>').join('')+'</div></section></div>'}
function eligible(id,m,checked){let t=state.tasks.find(t=>t.id===id);if(!t)return;if(checked&&!t.eligible.includes(m))t.eligible.push(m);if(!checked)t.eligible=t.eligible.filter(x=>x!==m);if(!t.eligible.length){alert('Al menos una persona debe estar habilitada.');t.eligible=[m]}state.assignments={};save();render()}
function setTaskMode(id,mode){let t=state.tasks.find(t=>t.id===id);if(t)t.mode=mode;state.assignments={};save();render()}
function renderMenu(){let menu=weekMenu();return '<div class="layout"><section class="card wide"><div class="row"><h2>Menú de la semana</h2><button class="btn primary" onclick="regenerate()">Variar menú</button></div><p class="muted">Propuesta variada con proteína, vegetales y legumbres. Es un punto de partida, no un plan nutricional clínico.</p><div class="daygrid">'+DAYS.map((day,d)=>'<div class="day"><strong>'+day+'</strong>'+['almuerzo','cena'].map(k=>'<label class="field" style="margin-top:10px">'+(k==='almuerzo'?'Almuerzo':'Cena')+'<select onchange="changeMeal('+d+',\''+k+'\',this.value)">'+state.recipes.filter(r=>r.kind===k).map(r=>'<option value="'+esc(r.id)+'" '+(menu[d+':'+k]===r.id?'selected':'')+'>'+esc(r.name)+'</option>').join('')+'</select></label>').join('')+'</div>').join('')+'</div></section><section class="card wide"><div class="row"><h2>Del menú a las compras</h2><button class="btn primary" onclick="setTab(\'compras\')">Generar lista →</button></div><p class="muted">Se suman automáticamente los ingredientes de las recetas de esta semana; podés agregar extras del hogar.</p></section></div>'}
function changeMeal(d,k,id){weekMenu()[d+':'+k]=id;state.checked={};save();render()}
function regenerate(){let menu=weekMenu();let seed=(Date.now()%100000);for(let d=0;d<7;d++)for(const k of ['almuerzo','cena']){let options=state.recipes.filter(r=>r.kind===k);menu[d+':'+k]=options[(seed+d*3+(k==='cena'?1:0))%options.length]?.id||''}state.checked={};save();render()}
function grocery(){let result=new Map();for(let d=0;d<7;d++)for(let k of ['almuerzo','cena']){let r=recipeAt(d,k);for(let [name,qty,unit] of r?.ingredients||[]){let key=name.toLowerCase()+'|'+unit;let old=result.get(key)||{name,qty:0,unit};old.qty+=Number(qty);result.set(key,old)}}return [...result.values()].sort((a,b)=>a.name.localeCompare(b.name,'es'))}
function renderShopping(){return '<div class="layout"><section class="card wide"><div class="row"><h2>Lista del supermercado</h2><button class="btn primary" onclick="copyShopping()">Copiar lista</button></div><p class="muted">Cantidades de ejemplo para las recetas; ajustalas a las porciones reales y revisá lo que ya hay en casa.</p><div class="shopping">'+grocery().map(x=>{let key=x.name+'|'+x.unit;return '<label><input type="checkbox" '+(state.checked[key]?'checked':'')+' onchange="checkPurchase(\''+esc(key)+'\',this.checked)"><span class="'+(state.checked[key]?'done':'')+'">'+esc(x.name)+' · '+x.qty+' '+esc(x.unit)+'</span></label>'}).join('')+state.extras.map((x,i)=>'<label><input type="checkbox" '+(state.checked['extra'+i]?'checked':'')+' onchange="checkPurchase(\'extra'+i+'\',this.checked)"><span>'+esc(x)+'</span></label>').join('')+'</div><form class="tools" onsubmit="event.preventDefault();addExtra(this.elements.item.value);this.reset()" style="margin-top:17px"><input name="item" placeholder="Ej.: detergente, leche, papel higiénico" required style="flex:1"><button class="btn primary">Agregar producto</button></form></section></div>'}
function addExtra(s){s=s.trim();if(s)state.extras.push(s);save();render()}
function checkPurchase(s,v){state.checked[s]=v;save();render()}
function copyShopping(){const lines=grocery().map(x=>(state.checked[x.name+'|'+x.unit]?'[x] ':'[ ] ')+x.name+' — '+x.qty+' '+x.unit);state.extras.forEach((x,i)=>lines.push((state.checked['extra'+i]?'[x] ':'[ ] ')+x));navigator.clipboard?.writeText('Compras · '+weekKey()+'\n'+lines.join('\n')).then(()=>alert('Lista copiada')).catch(()=>prompt('Copiá la lista:',lines.join('\n')))}
function renderRecipes(){return '<div class="layout"><section class="card wide"><h2>Recetario familiar</h2><div class="layout">'+state.recipes.map(r=>'<article class="item"><div class="row"><b>'+esc(r.name)+'</b><span class="tag">'+esc(r.category)+'</span></div><p class="muted">'+(r.kind==='almuerzo'?'Almuerzo':'Cena')+'</p><details><summary>Ingredientes y preparación</summary><p class="tiny">'+r.ingredients.map(i=>esc(i.join(' '))).join(' · ')+'</p><p>'+esc(r.steps)+'</p></details></article>').join('')+'</div></section><section class="card wide"><h2>Agregar receta</h2><form class="formgrid" onsubmit="createRecipe(event)"><label class="field">Nombre<input name="name" required maxlength="90"></label><label class="field">Momento<select name="kind"><option value="almuerzo">Almuerzo</option><option value="cena">Cena</option></select></label><label class="field">Tipo<select name="category"><option value="proteína">Proteína</option><option value="vegetariano">Vegetariano</option><option value="legumbres">Legumbres</option></select></label><label class="field">Ingredientes, uno por línea (nombre;cantidad;unidad)<textarea name="ingredients" required placeholder="Arroz;500;g&#10;Tomate;2;un"></textarea></label><label class="field full">Preparación<textarea name="steps" required></textarea></label><button class="btn primary">Guardar receta</button></form></section></div>'}
function createRecipe(e){e.preventDefault();let f=new FormData(e.target);let lines=String(f.get('ingredients')).split('\n').map(l=>l.split(';').map(s=>s.trim())).filter(a=>a.length===3&&a[0]&&Number(a[1])>0&&a[2]).map(a=>[a[0],Number(a[1]),a[2]]);if(!lines.length){alert('Escribí ingredientes con formato nombre;cantidad;unidad');return}state.recipes.push({id:'r'+Date.now(),name:String(f.get('name')).trim(),kind:String(f.get('kind')),category:String(f.get('category')),ingredients:lines,steps:String(f.get('steps')).trim()});save();render()}
render();
</script></body></html>
