<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://ucom-api.ufotech.com.py; img-src 'self' data: blob: https:; style-src 'self'; script-src 'self'; base-uri 'none'; object-src 'none'">
  <title>UCOM Workspace</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./collab.css">
  <script defer src="./collab-ui.js"></script>
  <script defer src="./create-v5.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <main id="landing" class="landing">
    <section class="landing-shell">
      <header class="brandbar">
        <div class="brandmark">U</div>
        <div><div class="eyebrow">UCOM</div><h1>Workspace</h1></div>
      </header>
      <div class="hero compact-hero">
        <div><span id="adminState" class="status-pill">Admin desconectado</span><h2>Tareas UCOM</h2></div>
        <div class="hero-actions">
          <button id="adminLoginBtn" class="ghost large">Administrador</button>
          <button id="newProjectBtn" class="primary large">Nueva tarea</button>
          <button id="openTaskBtn" class="ghost large">Entrar</button>
        </div>
      </div>
      <section class="recent-card">
        <div class="section-head"><div><h3>Tareas</h3></div><button id="adminLogoutBtn" class="ghost hidden">Cerrar sesión</button></div>
        <div id="projectList" class="recent-list"></div>
      </section>
    </section>
  </main>

  <main id="workspace" class="workspace hidden">
    <header class="workspace-top">
      <div class="workspace-brand">
        <button id="backBtn" class="icon-btn" aria-label="Volver">←</button>
        <div><div class="eyebrow">UCOM Workspace</div><strong id="workspaceTitle">Tarea</strong></div>
      </div>
      <div class="workspace-actions">
        <span id="accessBadge" class="status-pill">Acceso</span>
        <span id="saveState" class="save-state">Guardado</span>
        <button id="historyBtn" class="ghost">Historial</button>
        <button id="accessBtn" class="ghost admin-only">Compartir</button>
        <a class="ghost design-link" href="./templates/">Diseño</a>
        <button id="exportBtn" class="ghost">HTML</button>
        <button id="saveBtn" class="primary">Guardar</button>
      </div>
    </header>

    <section class="workspace-grid">
      <aside class="panel directives-panel">
        <div class="panel-head"><span class="panel-number">01</span><div><h3>Tarea</h3></div></div>
        <input id="classDateInput" class="hidden" type="date" aria-hidden="true">
        <div class="field-grid">
          <label>Materia<input id="subjectInput" maxlength="160"></label>
          <label>Título<input id="titleInput" maxlength="240"></label>
          <label>Profesor/a<input id="professorInput" maxlength="160"></label>
          <label>Entrega<input id="dueDateInput" type="datetime-local"></label>
          <label>Tipo<select id="workTypeInput"><option value="group">Grupal</option><option value="individual">Individual</option></select></label>
          <label id="workspaceCapacityWrap" class="admin-only-field">Cupo<input id="maxMembersInput" type="number" min="2" max="30" value="6"></label>
        </div>

        <div class="member-editor admin-only-field">
          <div class="member-editor-head"><label id="memberEditorLabel">Integrantes</label><span id="capacityState" class="capacity-state"></span></div>
          <div class="member-add"><input id="memberInput" maxlength="120" placeholder="Nombre y apellido"><button id="addMemberBtn" class="ghost" type="button">Agregar</button></div>
          <div id="membersList" class="member-list"></div>
          <textarea id="membersInput" class="hidden" aria-hidden="true"></textarea>
        </div>

        <label class="grow-label">Consigna<textarea id="directivesInput" class="grow-area"></textarea></label>
      </aside>

      <section class="panel content-panel">
        <div class="panel-head"><span class="panel-number">02</span><div><h3>Contenido</h3></div></div>
        <textarea id="contentInput" class="content-editor" spellcheck="true"></textarea>
      </section>

      <section class="panel preview-panel">
        <div class="panel-head preview-head">
          <span class="panel-number">03</span><div><h3>Vista</h3></div>
          <select id="templateInput" class="template-select" aria-label="Plantilla"><option value="ucom">UCOM</option><option value="minimal">Minimal</option><option value="visual">Visual</option></select>
        </div>
        <div class="preview-scroll"><article id="previewPaper" class="paper theme-ucom"></article></div>
      </section>
    </section>

    <section class="chat-panel">
      <div class="chat-head"><div><span class="panel-number">04</span><h3>Chat general</h3></div><button id="refreshChatBtn" class="ghost" type="button">Actualizar</button></div>
      <div id="chatMessages" class="chat-messages"></div>
      <form id="chatForm" class="chat-compose"><textarea id="chatInput" maxlength="2000" rows="2" placeholder="Mensaje"></textarea><button class="primary" type="submit">Enviar</button></form>
    </section>
  </main>

  <dialog id="adminDialog">
    <form id="adminForm" class="dialog-card">
      <div class="dialog-head"><div><h2>Administrador</h2></div><button type="button" class="icon-btn dialog-close">×</button></div>
      <p id="adminHint" class="admin-login-state"></p>
      <label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="primary" type="submit">Entrar</button>
    </form>
  </dialog>

  <dialog id="createDialog" class="create-task-dialog">
    <form id="createForm" class="dialog-card create-dialog-card">
      <div class="dialog-head"><div><div class="eyebrow">UCOM</div><h2>Nueva tarea</h2></div><button type="button" class="icon-btn dialog-close">×</button></div>

      <div class="create-main-grid">
        <label>Materia<input name="subject" required autocomplete="off"></label>
        <label>Título<input name="title" required autocomplete="off"></label>
        <label>Profesor/a<input name="professor" autocomplete="off"></label>
        <label>Entrega<input id="createDueDate" name="due_date" type="datetime-local" required></label>
      </div>

      <input id="createClassDate" name="class_date" type="hidden">
      <textarea name="members" class="hidden" aria-hidden="true"></textarea>

      <div class="create-section">
        <span class="create-label">Tipo</span>
        <div class="type-picker">
          <label class="type-card"><input type="radio" name="work_type" value="group" checked><span><strong>Grupal</strong></span></label>
          <label class="type-card"><input type="radio" name="work_type" value="individual"><span><strong>Individual</strong></span></label>
        </div>
        <select id="createWorkType" class="hidden" aria-hidden="true" tabindex="-1"><option value="group">Grupal</option><option value="individual">Individual</option></select>
      </div>

      <div class="create-bottom-grid">
        <label id="createCapacityWrap">Cupo de integrantes<input name="max_members" id="createMaxMembers" type="number" min="2" max="30" value="6"></label>
        <label>Acceso
          <select name="access_mode" id="createAccessMode">
            <option value="project_end" selected>Hasta la entrega</option>
            <option value="custom">Fecha y hora</option>
            <option value="6h">6 horas</option>
            <option value="24h">24 horas</option>
            <option value="72h">72 horas</option>
          </select>
        </label>
        <label id="createAccessCustomWrap" class="hidden">Expira<input name="access_expires_at" type="datetime-local"></label>
      </div>

      <div id="createError" class="form-error hidden" role="alert"></div>
      <div class="create-actions"><button class="primary create-submit" type="submit">Crear tarea</button></div>
    </form>
  </dialog>

  <dialog id="joinDialog">
    <form id="joinForm" class="dialog-card">
      <div class="dialog-head"><div><h2>Ingresar a la tarea</h2></div><button type="button" class="icon-btn dialog-close">×</button></div>
      <label>Nombre y apellido<input name="name" maxlength="120" autocomplete="name" required autofocus></label>
      <button class="primary" type="submit">Ingresar</button>
    </form>
  </dialog>

  <dialog id="memberDialog">
    <form id="memberForm" class="dialog-card">
      <div class="dialog-head"><div><h2>Entrar</h2></div><button type="button" class="icon-btn dialog-close">×</button></div>
      <label>Código<input name="project_id" required></label>
      <label>Nombre<input name="name" autocomplete="name" required></label>
      <label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="primary" type="submit">Entrar</button>
    </form>
  </dialog>

  <dialog id="accessDialog">
    <div class="dialog-card share-dialog">
      <div class="dialog-head"><div><h2>Compartir tarea</h2></div><button type="button" class="icon-btn dialog-close">×</button></div>
      <div id="accessInfo" class="access-line"></div>
      <div id="accessSecret" class="share-result hidden">
        <div id="shareQrWrap" class="share-qr hidden"><img id="shareQrImg" alt="QR de acceso"><span>QR</span></div>
        <div class="share-fields">
          <div class="secret-box"><code id="accessLink"></code><button id="copyLinkBtn" class="ghost" type="button">Copiar enlace</button></div>
          <div id="passwordSecretRow" class="secret-box"><code id="accessPassword"></code><button id="copyPasswordBtn" class="ghost" type="button">Copiar contraseña</button></div>
        </div>
      </div>
      <form id="rotateAccessForm">
        <div class="access-grid">
          <label>Vence
            <select name="access_mode" id="rotateAccessMode">
              <option value="project_end" selected>Hasta la entrega</option>
              <option value="custom">Fecha y hora</option>
              <option value="6h">6 horas</option>
              <option value="24h">24 horas</option>
              <option value="72h">72 horas</option>
            </select>
          </label>
          <label id="rotateAccessCustomWrap" class="hidden">Expira<input name="access_expires_at" type="datetime-local"></label>
        </div>
        <div class="dialog-actions"><button class="primary" type="submit">Regenerar acceso</button><button id="revokeAccessBtn" class="ghost" type="button">Revocar</button></div>
      </form>
    </div>
  </dialog>

  <dialog id="historyDialog"><div class="dialog-card wide-dialog"><div class="dialog-head"><div><h2>Historial</h2></div><button type="button" class="icon-btn dialog-close">×</button></div><div id="historyList" class="history-list"></div></div></dialog>
  <dialog id="versionDialog"><div class="dialog-card wide-dialog"><div class="dialog-head"><div><h2 id="versionTitle">Versión</h2></div><button type="button" class="icon-btn dialog-close">×</button></div><pre id="versionContent" class="version-content"></pre><button id="restoreVersionBtn" class="primary admin-only">Restaurar</button></div></dialog>
</body>
</html>
