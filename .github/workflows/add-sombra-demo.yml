name: add-sombra-demo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-sombra-demo.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Sombra demo loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script type="module" src="/sombra/embed.js"></script>'
          if tag not in s:
              if '</body>' not in s:
                  raise SystemExit('body close not found')
              s=s.replace('</body>',tag+'</body>',1)
              p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name generiz
          git config user.email 39973192+generiz@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "load sombra interactive demo"
          git push
