name: reposition-home

on:
  push:
    branches: [main]
    paths:
      - 'tools/reposition_home.py'
      - '.github/workflows/reposition-home.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite home
        run: python tools/reposition_home.py
      - name: Commit home
        run: |
          git config user.name generiz
          git config user.email 39973192+generiz@users.noreply.github.com
          git add index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "reposition home around interventions"
          git push
