name: contact-form

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/contact_form.py'
      - '.github/workflows/contact-form.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch contact section
        run: python .github/scripts/contact_form.py
      - name: Commit
        run: |
          git config user.name generiz
          git config user.email 39973192+generiz@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "add email and contact form"
          git push
