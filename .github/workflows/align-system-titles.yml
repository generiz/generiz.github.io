name: align-system-titles

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/align-system-titles.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align system card title blocks
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '.systems-grid .system-card h3{font-size:clamp(34px,3.9vw,58px);line-height:.94;overflow-wrap:anywhere;word-break:normal;margin:56px 0 20px}'
          new = '.systems-grid .system-card h3{font-size:clamp(34px,3.9vw,58px);line-height:.94;overflow-wrap:anywhere;word-break:normal;margin:56px 0 20px;min-height:1.88em}'
          if old not in s:
              raise SystemExit('system title rule not found')
          s = s.replace(old, new, 1)
          old_media = '@media(max-width:900px){.intervention-grid{grid-template-columns:1fr}.intervention-card{min-height:0}.systems-grid .system-card{grid-column:1/-1}.layer-stack{grid-template-columns:1fr}.flow{line-height:1.8}}'
          new_media = '@media(max-width:900px){.intervention-grid{grid-template-columns:1fr}.intervention-card{min-height:0}.systems-grid .system-card{grid-column:1/-1}.systems-grid .system-card h3{min-height:0}.layer-stack{grid-template-columns:1fr}.flow{line-height:1.8}}'
          if old_media not in s:
              raise SystemExit('systems media rule not found')
          p.write_text(s.replace(old_media, new_media, 1))
          PY
      - name: Commit
        run: |
          git config user.name generiz
          git config user.email 39973192+generiz@users.noreply.github.com
          git add index.html
          git commit -m "align system card titles"
          git push
