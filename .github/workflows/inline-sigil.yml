name: inline-sigil

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inline-sigil.yml'
      - '.github/scripts/inline_sigil.py'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch homepage
        run: python .github/scripts/inline_sigil.py
      - name: Commit homepage update
        run: |
          if git diff --quiet -- index.html; then
            exit 0
          fi
          git config user.name generiz
          git config user.email 39973192+generiz@users.noreply.github.com
          git add index.html
          git commit -m "embed sigil demo on homepage"
          git push
