name: positioning-refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/positioning-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite positioning
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          s = re.sub(r'<meta name="description" content="[^"]*">', '<meta name="description" content="Nicolás Pintos — consultoría de infraestructura, operación IT y seguridad aplicada. Implementación, procurement, automatización, soporte y prototipos técnicos propios.">', s, count=1)
          s = re.sub(r'<title>.*?</title>', '<title>Nicolás Pintos — Infraestructura, Seguridad Aplicada y Operación IT</title>', s, count=1)

          s = s.replace('Security engineering · Privacy · Infrastructure · Resilient systems', 'Infraestructura · seguridad aplicada · operación IT')
          s = s.replace('Seguridad, privacidad e infraestructura para <span>personas y empresas con sistemas, datos o exposición que cuidar.</span>', 'Consultor de infraestructura y seguridad aplicada. <span>Diseño, selecciono, implemento y opero sistemas.</span>')
          s = s.replace('Consultoría IT de extremo a extremo: arquitectura, procurement tecnológico, automatización, seguridad y operación. Desarrollo además herramientas propias de cifrado, comunicaciones y redes resilientes.', 'Trabajo en redes, endpoints, storage, procurement, automatización, soporte y continuidad. En paralelo desarrollo prototipos propios de cifrado y comunicaciones resilientes.')
          s = s.replace('<div class="actions"><a class="btn primary" href="#lab">Ver proyectos ↓</a><a class="btn" href="#consultoria">Consultoría IT ↘</a></div>', '<div class="actions"><a class="btn primary" href="#consultoria">Consultoría IT ↓</a><a class="btn" href="#lab">Security Lab ↘</a></div>')
          s = s.replace('<div class="hero-stats mono"><span><b>20+ años</b> en tecnología</span><span><b>Security · Systems · Infrastructure</b></span><span>Paraguay</span></div>', '<div class="hero-stats mono"><span><b>20+ años</b> en tecnología</span><span><b>Infraestructura · soporte · automatización</b></span><span>Paraguay</span></div>')

          s = s.replace('Architecture model / defense in depth', 'Architecture model / IT operations')
          s = s.replace('policy core</span>', 'systems core</span>', 1)
          s = s.replace('<title id="archTitle">Arquitectura de seguridad por capas</title>', '<title id="archTitle">Arquitectura de infraestructura y operación</title>')
          s = s.replace('<desc id="archDesc">Identidad, endpoints, tráfico, almacenamiento, automatización y conectividad coordinados alrededor de un núcleo de políticas.</desc>', '<desc id="archDesc">Endpoints, red, almacenamiento, acceso, backups y automatización coordinados alrededor de un núcleo operativo.</desc>')
          s = s.replace('>POLICY CORE</text>', '>SYSTEMS CORE</text>')
          s = s.replace('>identity · trust · egress</text>', '>network · endpoints · data</text>')
          s = s.replace('>local decision boundary</text>', '>operation and security boundary</text>')
          s = s.replace('<div class="vnode left vn1">endpoint</div><div class="vnode right vn2">uplink</div><div class="vnode left vn3">identity</div><div class="vnode right vn4">egress</div><div class="vnode left vn5">encrypted data</div><div class="vnode right vn6">automation</div>', '<div class="vnode left vn1">endpoint</div><div class="vnode right vn2">network</div><div class="vnode left vn3">access</div><div class="vnode right vn4">storage</div><div class="vnode left vn5">backup</div><div class="vnode right vn6">automation</div>')
          s = s.replace('<div><span>Identity</span><span><b>Least privilege</b> · verificación</span></div>\n      <div><span>Traffic</span><span><b>Policy routed</b> · segmentación</span></div>\n      <div><span>Data</span><span><b>Authenticated encryption</b></span></div>\n      <div><span>Continuity</span><span><b>Resilient paths</b> · failover</span></div>', '<div><span>Endpoint</span><span><b>Hardening</b> · estándares</span></div>\n      <div><span>Network</span><span><b>Segmentación</b> · acceso</span></div>\n      <div><span>Data</span><span><b>Backup</b> · cifrado</span></div>\n      <div><span>Continuity</span><span><b>Monitoreo</b> · recuperación</span></div>')

          areas = '''<section class="section stack" id="modelo"><div class="shell reveal"><div class="head"><div class="kicker mono">01 / Áreas</div><div><h2>Infraestructura, operación, seguridad y automatización.</h2><p class="lead">El trabajo parte de sistemas reales: equipos, red, datos, accesos, proveedores y continuidad.</p></div></div><div class="stack-grid"><div class="stack-item"><span class="mono">Infrastructure</span><h3>Infraestructura</h3><p>Redes, storage, endpoints, virtualización, conectividad y backups. Diseño y configuración según la operación que tienen que sostener.</p></div><div class="stack-item"><span class="mono">Operations</span><h3>Operación</h3><p>Soporte, inventario, documentación, accesos, proveedores y continuidad. Menos dependencia de conocimiento informal y tareas repetitivas.</p></div><div class="stack-item"><span class="mono">Security</span><h3>Seguridad aplicada</h3><p>Exposición, hardening, identidad, segmentación, cifrado en tránsito y reposo, y recuperación. Controles concretos sobre infraestructura existente.</p></div><div class="stack-item"><span class="mono">Lab</span><h3>Prototipos</h3><p>Herramientas propias de cifrado y comunicaciones resilientes. Son proyectos de laboratorio; no se presentan como productos de producción.</p></div></div></div></section>'''
          s = re.sub(r'<section class="section stack" id="modelo">.*?</section>\n(?=<section class="section consult")', areas + '\n', s, count=1, flags=re.S)

          services = '''<section class="section consult" id="consultoria"><div class="shell reveal"><div class="head"><div class="kicker mono">02 / Servicios</div><div><h2>Diseño, selección, implementación y operación.</h2><p class="lead">Intervenciones puntuales o trabajo continuo sobre la infraestructura y la operación IT.</p></div></div><div class="consult-grid"><div class="consult-card"><span class="mono">01 / Infrastructure</span><h3>Infraestructura y redes</h3><p>Diseño e implementación de redes, segmentación, storage, endpoints, virtualización, conectividad, backups y continuidad.</p></div><div class="consult-card"><span class="mono">02 / Procurement</span><h3>Procurement y estándares</h3><p>Selección de hardware y plataformas por capacidad, compatibilidad, soporte, garantía, ciclo de vida y costo total. Definición de estándares para evitar compras aisladas.</p></div><div class="consult-card"><span class="mono">03 / Operations</span><h3>Operación, soporte y recuperación</h3><p>Soporte técnico, inventario, documentación, accesos, proveedores, diagnóstico de fallos y recuperación de operación.</p></div><div class="consult-card"><span class="mono">04 / Security</span><h3>Seguridad aplicada</h3><p>Revisión de exposición, hardening, identidad y permisos, segmentación, cifrado, backups y reducción de superficie innecesaria.</p></div><div class="consult-card"><span class="mono">05 / Automation</span><h3>Automatización y sistemas internos</h3><p>Scripts, integraciones y herramientas internas para reducir tareas manuales, errores repetitivos y tiempos operativos.</p></div></div></div></section>'''
          s = re.sub(r'<section class="section consult" id="consultoria">.*?</section>\n(?=<section class="section lab")', services + '\n', s, count=1, flags=re.S)

          lab = '''<section class="section lab" id="lab"><div class="shell reveal"><div class="head"><div class="kicker mono">03 / Security Lab</div><div><h2>Prototipos y utilidades propias.</h2><p class="lead">Código público seleccionado. Cada proyecto indica su estado y sus límites.</p></div></div><div class="labintro"><span></span><div class="labcount mono">4 public repos · research + utilities</div></div><div class="featured"><div class="project sigil-project" style="grid-column:1/-1;min-height:330px"><div class="tagline"><span class="tag mono">Secure messaging research / Rust · WebAssembly</span><span class="badge">Research prototype</span></div><h3>Sigil</h3><p>Prototipo de mensajería segura centrado en minimizar exposición de texto y rotar representaciones internas. El core Rust/WASM ejecuta doble AEAD y recuperación Reed–Solomon; la red de nodos de la demo es simulada.</p><div class="chips"><span class="chip">Rust/WASM</span><span class="chip">XChaCha20-Poly1305</span><span class="chip">Reed-Solomon</span><span class="chip">CI</span></div><div class="actions sigil-actions"><button class="btn primary" id="sigilOpen" type="button">Abrir demo</button><a class="btn" href="https://github.com/generiz/Sigil" target="_blank" rel="noopener">Código ↗</a></div></div><div id="sigilInlineRegion" class="sigil-inline-region" aria-hidden="true"><div class="sigil-inline-head"><div><span class="mono">Sigil · Live protocol demonstrator</span><small>Se ejecuta dentro de nicolaspintos.com</small></div><button id="sigilClose" type="button">Cerrar</button></div><sigil-inline-demo id="sigilInlineDemo"></sigil-inline-demo></div><a class="project lab-third" href="https://github.com/generiz/sombra" target="_blank" rel="noopener"><div class="tagline"><span class="tag mono">Resilient messaging / Rust</span><span class="badge">Research prototype</span></div><h3>Sombra</h3><p>Prototipo de mensajería tolerante a conectividad degradada. Implementa bundles, TTL, cola DTN persistente, scheduling y simulación; los drivers de radio y el cifrado de envelopes siguen en roadmap.</p><div class="chips"><span class="chip">Rust</span><span class="chip">DTN</span><span class="chip">Store-and-forward</span><span class="chip">CI</span></div></a><a class="project lab-third" href="https://github.com/generiz/IntraSeal" target="_blank" rel="noopener"><div class="tagline"><span class="tag mono">Encrypted file envelopes / Python</span><span class="badge">Utility</span></div><h3>IntraSeal</h3><p>CLI pequeña para cifrar archivos con AES-256-GCM, derivación de clave con scrypt, I/O por streaming y rechazo de envelopes modificados.</p><div class="chips"><span class="chip">Python</span><span class="chip">AES-256-GCM</span><span class="chip">scrypt</span><span class="chip">tests</span></div></a><a class="project lab-third" href="https://github.com/generiz/AnydeskVirtualDisplayFix" target="_blank" rel="noopener"><div class="tagline"><span class="tag mono">Remote support / Windows</span><span class="badge">Support utility</span></div><h3>AnyDesk Display Fix</h3><p>Utilidad de soporte para crear y mantener un display virtual en equipos Windows sin monitor físico, orientada a sesiones remotas con AnyDesk.</p><div class="chips"><span class="chip">PowerShell</span><span class="chip">Windows</span><span class="chip">AnyDesk</span><span class="chip">support</span></div></a></div></div></section>'''
          s = re.sub(r'<section class="section lab" id="lab">.*?</section>\n(?=<section class="section repo-section")', lab + '\n', s, count=1, flags=re.S)
          s = re.sub(r'<section class="section repo-section" id="trabajo">.*?</section>\n(?=<section class="bridge")', '', s, count=1, flags=re.S)

          s = s.replace('<div class="mono">05 / Operación</div>', '<div class="mono">04 / Operación</div>')
          s = s.replace('<div><p>Implementación, soporte e infraestructura para personas y empresas.</p>', '<div><p>ufotech es mi operación de implementación y soporte IT para personas y empresas. Equipos, infraestructura, redes y resolución de problemas.</p>')

          old_profile = '<div class="about"><div><div class="kicker mono">06 / Perfil</div><h2>Perfil profesional.</h2><p>Consultor IT y fundador de ufotech. Trabajo desde la definición de arquitectura y procurement hasta la implementación, automatización, seguridad y continuidad operativa.</p><p>En paralelo desarrollo proyectos propios de cifrado, comunicaciones y redes resilientes.</p></div><div class="aboutlines"><div class="aboutline"><span class="mono">Actividad</span><span>Consultoría IT · fundador de ufotech</span></div><div class="aboutline"><span class="mono">Formación</span><span>Ingeniería en Tecnologías e Innovación · En curso</span></div><div class="aboutline"><span class="mono">Formación</span><span>Licenciatura en Tecnología de la Información</span></div><div class="aboutline"><span class="mono">Áreas</span><span>Seguridad · privacidad · infraestructura · automatización</span></div><div class="aboutline"><span class="mono">Research</span><span>Criptografía aplicada · redes resilientes · control local</span></div></div></div>'
          new_profile = '<div class="about"><div><div class="kicker mono">05 / Perfil</div><h2>Perfil profesional.</h2><p>Consultor de infraestructura, operación IT y seguridad aplicada. Fundador de ufotech.</p><p>Trabajo con redes, endpoints, storage, procurement, automatización, soporte y recuperación. En paralelo desarrollo prototipos propios; el Lab está separado de los servicios.</p></div><div class="aboutlines"><div class="aboutline"><span class="mono">Actividad</span><span>Consultoría IT · fundador de ufotech</span></div><div class="aboutline"><span class="mono">Formación</span><span>Ingeniería en Tecnologías e Innovación · En curso</span></div><div class="aboutline"><span class="mono">Formación</span><span>Licenciatura en Tecnología de la Información</span></div><div class="aboutline"><span class="mono">Áreas</span><span>Infraestructura · operación · seguridad aplicada · automatización</span></div><div class="aboutline"><span class="mono">Lab</span><span>Cifrado · comunicaciones resilientes · herramientas propias</span></div></div></div>'
          s = s.replace(old_profile, new_profile)

          techs = ['Linux','Windows','Python','PowerShell','Rust','ZFS','Docker','Tailscale / WireGuard','VLAN / 802.1Q','GitHub Actions','AES-256-GCM','XChaCha20-Poly1305']
          seq = ''.join(f'<span>{x}</span><i></i>' for x in techs)
          seq = seq + seq
          new_tech = f'<div class="tech" aria-label="Tecnologías y áreas técnicas"><div class="track">{seq}</div></div>'
          s = re.sub(r'<div class="tech" aria-label="Tecnologías y áreas técnicas">.*?</div></div>\n(?=<section class="contact")', new_tech + '\n', s, count=1, flags=re.S)

          s = s.replace('<div class="kicker mono">07 / Contacto</div>', '<div class="kicker mono">06 / Contacto</div>')
          s = s.replace('Consultas sobre seguridad, privacidad, arquitectura tecnológica, procurement, automatización e infraestructura.', 'Consultas sobre infraestructura, soporte, procurement, automatización, seguridad aplicada y recuperación.')

          extra_css = '.project.lab-third{grid-column:span 4}@media(max-width:1050px){.project.lab-third{grid-column:span 12}}\n'
          if '.project.lab-third{' not in s:
              s = s.replace('</style>', extra_css + '</style>', 1)

          p.write_text(s)
          PY
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name generiz
          git config user.email 39973192+generiz@users.noreply.github.com
          git add index.html
          git commit -m "align public positioning with evidence"
          git push
