name: unify-sombra-ui

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unify-sombra-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/unify_sombra_ui.py
      - run: |
          git config user.name generiz
          git config user.email 39973192+generiz@users.noreply.github.com
          git add index.html
          git commit -m "match sombra demo ui to sigil"
          git push
