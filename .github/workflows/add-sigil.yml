name: add-sigil

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-sigil.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Sigil live demo card
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old = '''<a class="project" style="grid-column:1/-1;min-height:330px" href="/sigil/"><div class="tagline"><span class="tag mono">Secure messaging / Rust · WebAssembly</span><span class="badge">Live demo</span></div><h3>Sigil</h3><p>Mensajería segura experimental con representación efímera de símbolos, cifrado autenticado por capas y recuperación de ciphertext fragmentado. La demo ejecuta el core Rust real en WebAssembly dentro del navegador.</p><div class="chips"><span class="chip">Rust</span><span class="chip">WebAssembly</span><span class="chip">XChaCha20-Poly1305</span><span class="chip">Reed-Solomon</span></div></a>'''

          new = '''<a class="project" style="grid-column:1/-1;min-height:330px" href="/sigil/"><div class="tagline"><span class="tag mono">Secure messaging / Rust · WebAssembly</span><span class="badge">Live demo</span></div><h3>Sigil</h3><p>Mensajería segura experimental con representación efímera de símbolos, cifrado autenticado por capas y recuperación de ciphertext fragmentado. La demo ejecuta el core Rust real en WebAssembly y permite simular una topología de nodos para visualizar la distribución y reconstrucción de shards.</p><div class="chips"><span class="chip">Rust/WASM real</span><span class="chip">XChaCha20-Poly1305</span><span class="chip">Reed-Solomon</span><span class="chip">Node simulation</span></div></a>'''

          if old in text:
              text = text.replace(old, new, 1)
          elif new in text:
              print('Sigil card already current')
              raise SystemExit(0)
          else:
              raise SystemExit('Sigil card not found; refusing broad rewrite')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit site update
        run: |
          if git diff --quiet -- index.html; then
            exit 0
          fi
          git config user.name generiz
          git config user.email 39973192+generiz@users.noreply.github.com
          git add index.html
          git commit -m "update sigil live demo"
          git push
