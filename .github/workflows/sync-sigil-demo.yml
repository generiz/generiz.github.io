name: sync-sigil-demo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-sigil-demo.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch compiled Sigil demo
        run: |
          rm -rf /tmp/sigil-demo
          git clone --depth 1 --branch demo-dist https://github.com/generiz/Sigil.git /tmp/sigil-demo
          rm -rf /tmp/sigil-demo/.git
      - name: Replace site demo with first-party build
        run: |
          rm -rf sigil
          mkdir -p sigil
          cp -a /tmp/sigil-demo/. sigil/
      - name: Commit synced demo
        run: |
          git config user.name generiz
          git config user.email 39973192+generiz@users.noreply.github.com
          git add -A sigil
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "serve sigil demo first-party"
          git push

# secure-canvas build sync 2
