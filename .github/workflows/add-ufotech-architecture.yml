name: add-ufotech-architecture

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/inline_ufotech.py'
      - '.github/workflows/add-ufotech-architecture.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch ufotech card and architecture explorer
        run: python .github/scripts/inline_ufotech.py
      - name: Commit
        run: |
          git config user.name generiz
          git config user.email 39973192+generiz@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "add ufotech architecture explorer"
          git push
