name: Apply light theme option
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: python .github/patch_theme.py
      - name: Commit result
        run: |
          rm -f .github/patch_theme.py .github/workflows/apply-light-theme.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "add light theme option"
          git push
