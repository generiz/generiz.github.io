name: UCOM frontend smoke

on:
  push:
    branches: [main]
    paths:
      - "ucom/**"
      - ".github/workflows/ucom-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check direct paper JavaScript
        run: node --check ucom/direct-canvas-v23.js
      - name: Check active frontend wiring
        run: |
          grep -q 'wss://ucom-api.ufotech.com.py' ucom/index.html
          grep -q 'type="module" src="./direct-canvas-v23.js?v=23"' ucom/index.html
          grep -q 'direct-canvas-v23.css?v=23' ucom/index.html
          ! grep -q 'type="module" src="./realtime-v21.js' ucom/index.html
          ! grep -q 'type="module" src="./document-edit-v22.js' ucom/index.html
          ! grep -q 'script defer src="./blocks-v15.js' ucom/index.html
