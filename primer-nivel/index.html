<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fcfaf8">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="description" content="Esta propuesta comercial ha sido cancelada y retirada.">
  <meta property="og:title" content="Propuesta cancelada — NEXO">
  <meta property="og:description" content="Esta propuesta comercial ya no se encuentra disponible.">
  <title>Propuesta cancelada | NEXO</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='17' fill='%23fbe7df'/%3E%3Cpath d='M18 45V19l28 26V19' fill='none' stroke='%23b76a61' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root{color-scheme:light;--ink:#29354b;--muted:#788295;--line:#e8e6e6;--coral:#bd655e}
    *{box-sizing:border-box}
    html{min-height:100%;background:#fcfaf8}
    body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);overflow-x:hidden}
    .stage{position:relative;min-height:100vh;isolation:isolate;background:radial-gradient(ellipse at 7% 20%,#f9e9df 0%,transparent 42%),radial-gradient(ellipse at 90% 75%,#e9efff 0%,transparent 43%),#fcfaf8}
    .mock-site{position:absolute;inset:-45px -45px -125px;z-index:-2;pointer-events:none;user-select:none;filter:blur(18px);opacity:.65;transform:scale(1.035);overflow:hidden}
    .mock-wrap{width:min(1160px,93%);margin:auto}
    .mock-nav{height:94px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 max(35px,calc((100vw - 1160px)/2));border-bottom:1px solid #e9edf4}
    .brand-mock{display:flex;align-items:center;gap:16px}.mark{width:52px;height:52px;border-radius:15px;background:#f7d7d1}
    .line{height:12px;background:#c8d4e5;border-radius:100px}
    .nav-mock{display:flex;gap:28px}.nav-mock .line{width:70px;height:8px;background:#d5ddea}
    .mock-main{display:grid;grid-template-columns:1.1fr .9fr;gap:6%;padding:135px 0 115px;align-items:center}
    .text-stack{display:flex;flex-direction:column;gap:18px}.text-stack .line:nth-child(1){width:38%;height:11px;background:#d5bdc7;margin-bottom:15px}
    .text-stack .line:nth-child(2){width:93%;height:51px;background:#aabbd7}
    .text-stack .line:nth-child(3){width:75%;height:51px;background:#aabbd7}
    .text-stack .line:nth-child(4){width:56%;height:51px;background:#aabbd7}
    .text-stack .line:nth-child(5){width:96%;height:12px;margin-top:20px}
    .text-stack .line:nth-child(6){width:86%;height:12px}
    .text-stack .line:nth-child(7){width:69%;height:12px}
    .mock-actions{display:flex;gap:13px;margin-top:20px}.mock-actions span{height:47px;width:150px;background:#a9bddc;border-radius:25px}.mock-actions span+span{background:#fff;border:1px solid #bdc9db}
    .mock-picture{position:relative;background:#f0eaf5;border-radius:40% 54% 49% 42%;padding:42px 25px;transform:rotate(-6deg)}
    .mock-window{background:white;border:1px solid #e9e6ed;border-radius:22px;box-shadow:0 45px 75px #96a4bb48;transform:rotate(6deg);padding:0 24px 18px}
    .mock-head{height:52px;border-bottom:1px solid #edf0f4;display:flex;gap:8px;align-items:center}
    .mock-head i{height:10px;width:10px;background:#efc7c5;border-radius:50%}.mock-head i:nth-child(2){background:#d8d7e9}.mock-head i:nth-child(3){background:#d2e9df}
    .mock-row{display:flex;gap:15px;align-items:center;height:63px;border-bottom:1px solid #eef0f4}.mock-row:last-child{border:0}.mock-row:before{content:"";height:34px;width:34px;border-radius:10px;background:#e4eafa}.mock-row:nth-child(3):before{background:#fae7da}.mock-row:nth-child(4):before{background:#eae4f8}
    .mock-row .line{height:10px;width:63%}.mock-row:nth-child(3) .line{width:50%}.mock-row:nth-child(4) .line{width:74%}
    .mock-section{background:#fff;padding:75px 0 130px}
    .mock-section .heading{width:55%;height:45px;background:#afc0d8;border-radius:10px;margin-bottom:35px}
    .mock-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
    .mock-card{height:245px;border-radius:23px;background:#f4f1fd;border:1px solid #ece7f4;padding:30px}
    .mock-card:nth-child(2){background:#fdf1ea}.mock-card:nth-child(3){background:#eef6ff}
    .mock-card:before{content:"";display:block;width:50px;height:50px;background:#d9d2eb;border-radius:15px;margin-bottom:40px}
    .mock-card .line{margin:17px 0;height:11px;width:85%}.mock-card .line:last-child{width:65%}
    .veil{position:absolute;inset:0;z-index:-1;background:linear-gradient(150deg,#fffdfa8f,#fdfcfc99 48%,#fffafa9c)}
    .topbar{position:relative;display:flex;align-items:center;justify-content:space-between;gap:20px;max-width:1250px;padding:27px 28px;margin:auto}
    .brand{display:flex;align-items:center;gap:10px;color:#687487;font-weight:800;letter-spacing:.10em;font-size:13px}
    .brand-icon{display:grid;place-items:center;width:35px;height:35px;background:#fff3ef;border:1px solid #f0e0d8;color:#b66c64;border-radius:11px;font-size:21px;font-weight:900;letter-spacing:-.12em;padding-right:3px}
    .top-status{font-size:12px;color:#8c94a1;background:#ffffffb3;border:1px solid #eeeaeb;border-radius:50px;padding:9px 14px}
    .center{position:relative;display:flex;justify-content:center;align-items:center;min-height:calc(100vh - 175px);padding:45px 20px 70px}
    .notice{width:min(610px,100%);text-align:center;border:1px solid #fff;box-shadow:0 38px 95px #68748c30,0 10px 30px #8e879015;background:#ffffffeb;backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:30px;padding:62px 55px 60px}
    .symbol{width:72px;height:72px;border-radius:23px;background:#fff0ec;display:grid;place-items:center;margin:0 auto 28px;box-shadow:inset 0 0 0 1px #f8dcd5}
    .symbol svg{width:35px;height:35px;stroke:#bf6b62;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .alien-wrap{display:flex;justify-content:center;align-items:center;min-height:158px;margin:0 auto 24px}
    .alien-image{width:min(235px,80%);max-height:185px;object-fit:contain;filter:drop-shadow(0 12px 14px rgba(46,60,70,.12))}
    .alien-fallback{width:185px;height:auto;filter:drop-shadow(0 10px 8px rgba(46,60,70,.10))}
    .alien-image[hidden],.alien-fallback[hidden]{display:none}
    .overline{display:inline-flex;gap:9px;align-items:center;text-transform:uppercase;color:#ae736e;letter-spacing:.13em;font-weight:800;font-size:11px;margin-bottom:20px}
    .overline:before{content:"";width:7px;height:7px;background:#d48a81;border-radius:50%}
    h1{font-size:clamp(36px,5.6vw,58px);line-height:1.08;letter-spacing:-.065em;font-weight:800;margin:0 0 22px;color:#25324a}
    .notice p{color:#748194;font-size:16px;line-height:1.8;max-width:440px;margin:0 auto}
    .notice hr{height:1px;border:0;background:#ece9e9;margin:31px auto 26px;max-width:390px}
    .recipient{font-weight:700;font-size:12px;color:#8c94a3;letter-spacing:.015em}
    .footer{position:relative;text-align:center;color:#9096a2;padding:11px 20px 28px;font-size:12px;letter-spacing:.01em}
    @media(max-width:680px){
      .mock-site{inset:-20px -100px -75px;filter:blur(20px)}
      .mock-main{grid-template-columns:1fr;padding-top:70px;gap:50px}
      .mock-picture{width:83%;margin:0 auto}.mock-cards{grid-template-columns:1fr 1fr}.mock-card:nth-child(3){display:none}
      .nav-mock{display:none}
      .topbar{padding:20px 19px}.top-status{font-size:10px}
      .center{min-height:calc(100svh - 155px);padding:25px 17px 45px}
      .notice{border-radius:24px;padding:47px 26px}
      .notice p{font-size:14px}
    }
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
  </style>
</head>
<body>
  <div class="stage">
    <!-- Elementos abstractos: no se envía al navegador el contenido de la propuesta retirada. -->
    <div class="mock-site" aria-hidden="true">
      <div class="mock-nav"><div class="brand-mock"><div class="mark"></div><div class="line" style="width:115px"></div></div><div class="nav-mock"><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div></div></div>
      <div class="mock-wrap mock-main">
        <div class="text-stack"><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="mock-actions"><span></span><span></span></div></div>
        <div class="mock-picture"><div class="mock-window"><div class="mock-head"><i></i><i></i><i></i></div><div class="mock-row"><div class="line"></div></div><div class="mock-row"><div class="line"></div></div><div class="mock-row"><div class="line"></div></div><div class="mock-row"><div class="line"></div></div></div></div>
      </div>
      <div class="mock-section"><div class="mock-wrap"><div class="heading"></div><div class="mock-cards"><div class="mock-card"><div class="line"></div><div class="line"></div></div><div class="mock-card"><div class="line"></div><div class="line"></div></div><div class="mock-card"><div class="line"></div><div class="line"></div></div></div></div></div>
    </div>
    <div class="veil" aria-hidden="true"></div>
    <header class="topbar"><div class="brand"><span class="brand-icon">N</span><span>NEXO</span></div><div class="top-status">Propuesta comercial</div></header>
    <main class="center">
      <section class="notice" role="status" aria-labelledby="cancel-title">
        <div class="alien-wrap">
          <img class="alien-image" src="https://sistema.ufotech.com.py/static/img/error-404-alien-searching.png" alt="Alien de Ufotech buscando la página" loading="eager" decoding="async" onerror="this.hidden=true;this.nextElementSibling.hidden=false">

            <ellipse cx="105" cy="160" rx="69" ry="9" fill="#d9d4db" opacity=".38"/>
            <path d="M66 114Q53 137 73 151h64q21-14 8-37" fill="#80bda8" stroke="#416c67" stroke-width="4" stroke-linejoin="round"/>
            <path d="M88 44Q64 17 68 7M122 44q22-27 18-37" stroke="#72a99c" stroke-width="7" fill="none" stroke-linecap="round"/>
            <ellipse cx="68" cy="8" rx="9" ry="7" fill="#75ad9d"/><ellipse cx="140" cy="8" rx="9" ry="7" fill="#75ad9d"/>
            <path d="M105 27C64 27 40 54 45 94s34 47 60 47 56-11 60-47-19-67-60-67Z" fill="#9dd8b7" stroke="#416c67" stroke-width="4"/>
            <path d="M65 74c16-17 29 0 22 17-5 12-21 12-26 2-3-7 0-14 4-19Zm80 0c-16-17-29 0-22 17 5 12 21 12 26 2 3-7 0-14-4-19Z" fill="#3d4d64"/>
            <path d="M93 116q12-12 24 0" fill="none" stroke="#547667" stroke-width="4" stroke-linecap="round"/>

            <path d="M55 130q-24-12-30 4m130-4q24-12 30 4" fill="none" stroke="#6fa997" stroke-width="8" stroke-linecap="round"/>

          </svg>
        </div>
        <div class="overline">Estado de la propuesta</div>
        <h1 id="cancel-title">Propuesta<br>cancelada</h1>
        <p>Esta propuesta comercial ha sido retirada y ya no se encuentra disponible.</p>

    </main>
    <footer class="footer">Nicolás Pintos · Ufotech</footer>
  </div>
</body>
</html>
